# ⚠️ 实验级 spike compose，非生产支持。
# 用法（在仓库根目录执行）：
#   docker compose -f docker/server/docker-compose.spike.yaml up --build -d
#   curl -i http://localhost:8787/health
#   docker compose -f docker/server/docker-compose.spike.yaml exec server node /app/docker/server/probe-db.mjs
#   docker compose -f docker/server/docker-compose.spike.yaml down -v
name: zero-server-spike

services:
  db:
    # Docker Hub 不可达时可覆盖：POSTGRES_IMAGE=docker.m.daocloud.io/library/postgres:17-alpine
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zerodotemail
    ports:
      - "55432:5432"
    volumes:
      - pgdata-spike:/var/lib/postgresql/data
      # 挂载 drizzle 迁移 SQL（文件内 `--> statement-breakpoint` 行是 PG 合法注释），
      # 使 PG 初始即带 schema，供后续触库验证。
      - ../../packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zerodotemail"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: docker/server/Dockerfile
      args:
        # Docker Hub 不可达时可覆盖：NODE_IMAGE=docker.m.daocloud.io/library/node:22-alpine
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:22-alpine}
    environment:
      # 覆盖 wrangler.jsonc 里 Hyperdrive 的 localConnectionString（容器内 PG 不在 localhost）。
      # 机制实证：wrangler 4.16.0 cli.js —— localConnectionString 可被
      # WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_<BINDING> 环境变量覆盖。
      WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@db:5432/zerodotemail
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-spike:
